name: Monitor nb via GraphQL for Repo Owner Pushes & Run E2E

on:
  # schedule:
    # Runs every 15 minutes. Adjust frequency as needed (minimum is 5 minutes).
    # Use https://crontab.guru/ to define your schedule.
    # - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab for testing

# Set permissions required by the workflow
permissions:
  contents: read      # To read repository data via API (public repo) and checkout code
  actions: write      # To read/write artifacts for state persistence

# Prevent multiple scheduled runs from overlapping
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check_for_new_commit: # Renamed job slightly for clarity
    name: Check nocobase/nocobase via GraphQL for new commit by Repo Owner
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.check_commit.outputs.triggered }}
      branch: ${{ steps.check_commit.outputs.branch }}
      sha: ${{ steps.check_commit.outputs.sha }}
      timestamp: ${{ steps.check_commit.outputs.timestamp }} # Timestamp of the triggering commit (authoredDate)

    steps:
      # Checkout code of the current repo (where the workflow lives)
      # Still potentially optional, but harmless.
      - name: Checkout current repo code
        uses: actions/checkout@v4

      # --- Add Temporary Debug Step BEFORE Download ---
      - name: Manually List Artifacts via API
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: 14237362210 # The run ID that should have the artifact
        run: |
          echo "Attempting to list artifacts for Run ID ${PREVIOUS_RUN_ID} via REST API:"
          gh api "/repos/${{ github.repository }}/actions/runs/${PREVIOUS_RUN_ID}/artifacts" -q '.artifacts[] | select(.name=="last-repo-b-owner-commit-timestamp")' || echo "API call failed or artifact not found for run ${PREVIOUS_RUN_ID}"

          echo "Listing recent workflow runs (for context):"
          WORKFLOW_ID=$(gh workflow list --limit 1 --json id,name | jq -r '.[] | select(.name=="${{ github.workflow }}") | .id') # Get current workflow ID (may need adjustment based on exact name)
          if [ -n "$WORKFLOW_ID" ]; then
            gh api "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs" --paginate -q '.workflow_runs | map({id: .id, status: .status, conclusion: .conclusion, created_at: .created_at}) | sort_by(.created_at) | reverse | .[0:5]' || echo "Failed to list runs"
          else
            echo "Could not determine workflow ID."
          fi
      # --- End Temporary Debug Step ---


      # --- State Management (Same as before) ---
      - name: Download last processed timestamp artifact
        uses: actions/download-artifact@v4
        id: download-state
        with:
          name: last-repo-b-owner-commit-timestamp # Artifact name slightly updated
          path: ./state
          run-id: ''
        continue-on-error: true

      - name: Read last processed timestamp
        id: read_state
        run: |
          if [ -f ./state/timestamp.txt ]; then
            timestamp=$(cat ./state/timestamp.txt)
            # Validate timestamp format (ISO 8601 UTC)
            if [[ "$timestamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "last_timestamp=$timestamp" >> $GITHUB_OUTPUT
            else
              echo "last_timestamp=1970-01-01T00:00:00Z" >> $GITHUB_OUTPUT
              echo "Warning: Invalid timestamp found in artifact ('$timestamp'), using default."
            fi
          else
            # Default to a very old timestamp if no artifact exists
            echo "last_timestamp=1970-01-01T00:00:00Z" >> $GITHUB_OUTPUT
            echo "No previous state found."
          fi
          echo "Last processed timestamp: $(cat $GITHUB_OUTPUT | grep last_timestamp | cut -d'=' -f2)"


      # --- Check via GraphQL (Replaces the REST API check) ---
      - name: Check nocobase/nocobase via GraphQL for new commit
        id: check_commit
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_TIMESTAMP: ${{ steps.read_state.outputs.last_timestamp }}
          CHECK_USER_LOGIN: ${{ github.repository_owner }} # User whose commits we're looking for
          TARGET_REPO_FULLNAME: "nocobase/nocobase"       # Target repo Owner/Name
        run: |
          REPO_OWNER=$(echo $TARGET_REPO_FULLNAME | cut -d'/' -f1)
          REPO_NAME=$(echo $TARGET_REPO_FULLNAME | cut -d'/' -f2)

          echo "Checking repository ${TARGET_REPO_FULLNAME} for new commits..."
          echo "Looking for commits authored by: ${CHECK_USER_LOGIN}"
          echo "Filtering commits authored after: ${LAST_TIMESTAMP}"

          # Define the corrected GraphQL query:
          # - Fetch the first 30 refs (branches) based on default ordering.
          # - Removed orderBy clause.
          # - Removed $sinceDate variable declaration.
          # Increase 'first: 30' to e.g., 'first: 50' or 'first: 100' if concerned about missing
          # commits on less frequently returned branches.
          GRAPHQL_QUERY=$(cat <<EOF
          query RecentCommitsByAuthor(\$repoOwner: String!, \$repoName: String!) {
            repository(owner: \$repoOwner, name: \$repoName) {
              refs(refPrefix: "refs/heads/", first: 100) {
                nodes {
                  name # Branch name
                  target {
                    ... on Commit {
                      oid # Commit SHA
                      authoredDate
                      author {
                        user {
                          login
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          EOF
          )

          # Initialize variables
          LATEST_MATCH_TIMESTAMP="1970-01-01T00:00:00Z"
          LATEST_MATCH_BRANCH=""
          LATEST_MATCH_SHA=""
          TRIGGER="false"

          # Execute GraphQL query using GitHub CLI and process with jq
          echo "Running GraphQL query..."
          # Removed the -f sinceDate=... argument
          RESULT_JSON=$(gh api graphql -f query="$GRAPHQL_QUERY" \
            -f repoOwner="$REPO_OWNER" -f repoName="$REPO_NAME" \
             --jq '.' || echo "null") # Handle potential API errors by outputting "null"

          # --- DEBUG STEP: Print the raw JSON result ---
          echo "--- RAW GRAPHQL RESULT ---"
          echo "$RESULT_JSON"
          echo "--- END RAW GRAPHQL RESULT ---"
          # --- END DEBUG STEP ---

          if [ -z "$RESULT_JSON" ] || [ "$RESULT_JSON" == "null" ]; then
             echo "Error: GraphQL query failed or returned empty."
          elif [ "$(echo "$RESULT_JSON" | jq '.errors')" != "null" ]; then
             echo "Error: GraphQL query returned errors:"
             echo "$RESULT_JSON" | jq '.errors'
          elif [ "$(echo "$RESULT_JSON" | jq -r '.data.repository.refs.nodes // [] | length')" -gt 0 ]; then # Added // [] for safety
            echo "Processing results..."
            # Use jq to iterate through the commits on branch heads, filter by author and date,
            # find the one with the most recent authoredDate.
            # The jq logic remains the same, using the LAST_TIMESTAMP env var via --arg lastTs
            LATEST_MATCH=$(echo "$RESULT_JSON" | jq -r \
              --arg checkUser "$CHECK_USER_LOGIN" \
              --arg lastTs "$LAST_TIMESTAMP" \
              '
              .data.repository.refs.nodes
              | map(select(
                  .target? != null and
                  .target.author?.user?.login? == $checkUser and
                  .target.authoredDate? > $lastTs
              ))
              | sort_by(.target.authoredDate) # Sort ascending by date
              | last # Get the latest one
              | select(. != null) # Ensure we found something
              // empty # Return empty string if no match
              ')


            if [ -n "$LATEST_MATCH" ] && [ "$LATEST_MATCH" != "null" ]; then
              LATEST_MATCH_BRANCH=$(echo "$LATEST_MATCH" | jq -r '.name')
              LATEST_MATCH_SHA=$(echo "$LATEST_MATCH" | jq -r '.target.oid')
              LATEST_MATCH_TIMESTAMP=$(echo "$LATEST_MATCH" | jq -r '.target.authoredDate')
              # Final check to ensure this "latest" is truly newer than the stored state
              if [[ "$LATEST_MATCH_TIMESTAMP" > "$LAST_TIMESTAMP" ]]; then
                 TRIGGER="true"
                 echo "Found latest matching commit by $CHECK_USER_LOGIN on branch '$LATEST_MATCH_BRANCH' (SHA: $LATEST_MATCH_SHA) authored at $LATEST_MATCH_TIMESTAMP"
              else
                 # This case should be less likely now due to the > $lastTs filter in jq, but kept for safety
                 echo "Found commit $LATEST_MATCH_SHA by $CHECK_USER_LOGIN but its timestamp ($LATEST_MATCH_TIMESTAMP) is not newer than the last processed timestamp ($LAST_TIMESTAMP). Ignoring."
              fi
            else
              echo "No new commits found authored by $CHECK_USER_LOGIN in the checked refs since $LAST_TIMESTAMP."
            fi
          else
             echo "GraphQL query returned successfully but found no refs or relevant commit data."
          fi

          # Set outputs for the next job
          echo "triggered=${TRIGGER}" >> $GITHUB_OUTPUT
          echo "branch=${LATEST_MATCH_BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${LATEST_MATCH_SHA}" >> $GITHUB_OUTPUT
          # Only output timestamp if triggered to avoid saving old/invalid timestamp
          if [ "$TRIGGER" == "true" ]; then
             echo "timestamp=${LATEST_MATCH_TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      # --- State Saving (Update Artifact Name) ---
      # Save the authoredDate of the *newly found commit* as an artifact
      - name: Save latest processed commit timestamp as artifact
        # Only run this step if a new commit was actually found and triggered the process
        if: steps.check_commit.outputs.triggered == 'true'
        run: |
          mkdir -p ./state
          echo "${{ steps.check_commit.outputs.timestamp }}" > ./state/timestamp.txt
          echo "Saving timestamp for next run: ${{ steps.check_commit.outputs.timestamp }}"
      - uses: actions/upload-artifact@v4
        if: steps.check_commit.outputs.triggered == 'true'
        with:
          name: last-repo-b-owner-commit-timestamp # Must match the download name
          path: ./state/timestamp.txt
          retention-days: 90 # Keep state artifacts for a reasonable time

  # --- E2E Test Job (Remains the same) ---
  run_e2e_tests:
    name: Run Nocobase E2E Tests
    needs: check_for_new_commit # Depends on the updated check job
    if: needs.check_for_new_commit.outputs.triggered == 'true' # Only run if the check job found a new commit
    runs-on: ubuntu-latest
    container: node:18
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout the specific commit from nocobase/nocobase that triggered the run
      - name: Checkout nocobase/nocobase code on specific commit
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase # Target repository
          ref: ${{ needs.check_for_new_commit.outputs.sha }} # Checkout the exact commit SHA
          # No need to specify path or anything about pro-plugins here

      # Setup Node.js environment
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn' # Enable yarn caching based on lockfile

      # Get yarn cache directory path (needed for caching step)
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT # Use GITHUB_OUTPUT

      # Setup caching for yarn dependencies
      - name: Cache yarn dependencies
        uses: actions/cache@v4
        id: yarn-cache # Optional: Cache step ID
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Install project dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Build packages as required by E2E tests
      - name: Build packages
        run: yarn build
        env:
          __E2E__: true # Set environment variable needed during build for E2E

      # Install Playwright browsers required for tests
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Execute the E2E tests, using the command adapted from nocobase/e2e.yml
      # The --ignore pattern excludes pro-plugin tests
      - name: Run E2E tests (Core and Plugins - adapted)
        run: yarn e2e p-test --ignore 'packages/**/{plugin-data-source-main,plugin-workflow,plugin-workflow-*}/**/__e2e__/**/*.test.ts'
        env:
          # Set environment variables required by the tests
          __E2E__: true
          APP_ENV: production
          LOGGER_LEVEL: error
          DB_DIALECT: postgres
          DB_HOST: postgres # Use the service name defined above
          DB_PORT: 5432
          DB_USER: nocobase
          DB_PASSWORD: password
          DB_DATABASE: nocobase
          ENCRYPTION_FIELD_KEY: 1%&glK;<UA}aIxJVc53-4G(rTi0vg@J] # Use a placeholder or manage securely if needed for tests
          # CRITICAL: Do NOT include APPEND_PRESET_LOCAL_PLUGINS or similar pro-plugin vars

      # Optional: Upload E2E test reports as artifacts for review
      - name: Upload E2E test report artifact
        # Run this step even if the previous test step failed, to capture failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ needs.check_for_new_commit.outputs.branch }}-${{ github.run_id }}
          path: ./storage/playwright/tests-report-blob/blob-*/* # Path to Playwright reports in nocobase structure
          retention-days: 7 # Keep reports for 7 days